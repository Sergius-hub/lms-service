name: CI/CD Django + Compose

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_PROJECT_NAME: django_ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # 1. Генерируем .env с уникальными паролями
      # ─────────────────────────────────────────────
      - name: Generate .env for CI
        run: |
          set -euo pipefail
          POSTGRES_PASS=$(openssl rand -hex 16)
          REDIS_PASS=$(openssl rand -hex 16)
          DJANGO_KEY=$(openssl rand -hex 32)

          cat > .env <<EOF
          DJANGO_SECRET_KEY=${DJANGO_KEY}
          DJANGO_DEBUG=False
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=${POSTGRES_PASS}
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_PASSWORD=${REDIS_PASS}
          STRIPE_SECRET_KEY=0
          STRIPE_WEBHOOK_SECRET=0
          EOF

          chmod 600 .env

      # ─────────────────────────────────────────────
      # 2. Валидация: compose видит пароли, не пустые
      # ─────────────────────────────────────────────
#      - name: Validate compose config
#        run: |
#          set -euo pipefail
#          docker compose config > /dev/null
#
#          if docker compose config | grep -qE 'REDIS_PASSWORD:\s+($|"")'; then
#            echo "::error::REDIS_PASSWORD is empty in compose config"
#            exit 1
#          fi
#
#          if docker compose config | grep -qE 'POSTGRES_PASSWORD:\s*($|"")'; then
#            echo "::error::POSTGRES_PASSWORD is empty in compose config"
#            exit 1
#          fi
#
#          echo "✅ Compose config validated"

      # ─────────────────────────────────────────────
      # 3. Сборка и запуск
      # ─────────────────────────────────────────────
      - name: Build images
        run: docker compose build --parallel

      - name: Start all services
        run: docker compose up -d

      - name: Wait for db + redis healthy
        run: |
          set -euo pipefail
          for svc in db redis; do
            for i in {1..30}; do            
              status=$(docker compose ps --format json "$svc" \
                | jq -rs 'flatten | (.[0].Health // "none") | if .=="" then "none" else . end')
              if [ "$status" = "healthy" ]; then
                echo "✅ $svc healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                unhealthy=true
              fi
              echo "⏳ Waiting... ($i/30)"
              sleep 2
            done
          done
          if [ "$unhealthy" = true ]; then
            echo "::error::Services did not become healthy in 60s"
            docker compose ps
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 4. Миграции + тесты через Django
      # ─────────────────────────────────────────────
      - name: Run migrations
        run: docker compose exec -T web python manage.py migrate --noinput

      - name: Run Django tests
        run: docker compose exec -T web python manage.py test

      # ─────────────────────────────────────────────
      # 5. Диагностика и очистка
      # ─────────────────────────────────────────────
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

