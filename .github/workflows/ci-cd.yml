name: CI/CD Django + Compose

on: [push, pull_request]
#  push:
#    branches: [main, develop]
#  pull_request:
#    branches: [main, develop]

env:
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_PROJECT_NAME: django_ci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ─────────────────────────────────────────────
      # 1. Генерируем .env с уникальными паролями
      # ─────────────────────────────────────────────
      - name: Generate .env for CI
        run: |
          set -euo pipefail
          POSTGRES_PASS=$(openssl rand -hex 16)
          REDIS_PASS=$(openssl rand -hex 16)
          DJANGO_KEY=$(openssl rand -hex 32)

          cat > .env <<EOF
          DJANGO_SECRET_KEY=${DJANGO_KEY}
          DJANGO_DEBUG=False
          POSTGRES_DB=test_db
          POSTGRES_USER=test_user
          POSTGRES_PASSWORD=${POSTGRES_PASS}
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_PASSWORD=${REDIS_PASS}
          STRIPE_SECRET_KEY=0
          STRIPE_WEBHOOK_SECRET=0
          EOF

          chmod 600 .env

      # ─────────────────────────────────────────────
      # 2. Валидация: compose видит пароли, не пустые
      # ─────────────────────────────────────────────
#      - name: Validate compose config
#        run: |
#          set -euo pipefail
#          docker compose config > /dev/null
#
#          if docker compose config | grep -qE 'REDIS_PASSWORD:\s+($|"")'; then
#            echo "::error::REDIS_PASSWORD is empty in compose config"
#            exit 1
#          fi
#
#          if docker compose config | grep -qE 'POSTGRES_PASSWORD:\s*($|"")'; then
#            echo "::error::POSTGRES_PASSWORD is empty in compose config"
#            exit 1
#          fi
#
#          echo "✅ Compose config validated"

      # ─────────────────────────────────────────────
      # 3. Сборка и запуск
      # ─────────────────────────────────────────────
      - name: Build images
        run: docker compose build --parallel

      - name: Start all services
        run: docker compose up -d

      - name: Wait for db + redis healthy
        run: |
          set -euo pipefail
          unhealthy=false
          for svc in db redis; do
            for i in {1..30}; do            
              status=$(docker compose ps --format json "$svc" \
                | jq -rs 'flatten | (.[0].Health // "none") | if .=="" then "none" else . end')
              if [ "$status" = "healthy" ]; then
                echo "✅ $svc healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                unhealthy=true
              fi
              echo "⏳ Waiting... ($i/30)"
              sleep 2
            done
          done
          if [ "$unhealthy" = true ]; then
            echo "::error::Services did not become healthy in 60s"
            docker compose ps
            exit 1
          fi

      # ─────────────────────────────────────────────
      # 4. Миграции + тесты через Django
      # ─────────────────────────────────────────────
      - name: Run migrations
        run: docker compose exec -T web python manage.py migrate --noinput

      - name: Run Django tests
        run: docker compose exec -T web python manage.py test

      # ─────────────────────────────────────────────
      # 5. Диагностика и очистка
      # ─────────────────────────────────────────────
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  deploy:
    name: Deploy to server (rsync)
    runs-on: ubuntu-latest
    needs: test
#    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p 2236 -t ed25519 ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure remote directory exists
        run: |
          ssh -p 2236 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
          "mkdir -p /home/${{ secrets.SERVER_USER }}/deploy/apps/lms-service"

      - name: Sync files via rsync
        run: |
          rsync -avz --delete \
            -e 'ssh -p 2236' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='secrets' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='node_modules' \
            --exclude='media' \
            --exclude='staticfiles' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/${{ secrets.SERVER_USER }}/deploy/apps/lms-service/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SERVER_USER }}/deploy/apps/lms-service

            # Проверяем, что прод-.env на месте
            if [ ! -f .env ]; then
              echo "❌ .env not found in $(pwd)"
              echo "Create it manually on the server before first deploy"
              exit 1
            fi

            docker compose -f docker-compose.yml build --builder dns-fixed
            docker compose -f docker-compose.yml up -d
            
            unhealthy=false
            for svc in db redis; do
              for i in {1..30}; do            
                status=$(docker compose ps --format '{{.Health}}' "$svc")          
                if [ "$status" = "healthy" ]; then
                  echo "✅ $svc healthy"
                  break
                fi
                if [ "$i" -eq 30 ]; then
                  unhealthy=true
                fi
                echo "⏳ Waiting... ($i/30)"
                sleep 2
              done
            done
            if [ "$unhealthy" = true ]; then
              echo "::error::Services did not become healthy in 60s"
              docker compose ps
              exit 1
            fi
            
            docker compose exec -T web python manage.py migrate --noinput
            docker compose exec -T web python manage.py collectstatic --noinput
            echo "Deployed at $(date)"

            docker image prune -f || echo "⚠️ Prune skipped"